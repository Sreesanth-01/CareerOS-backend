spring.datasource.url=jdbc:h2:mem:careeros-test;NON_KEYWORDS=USER
# here, h2:'mem' means in-memory. the H2 DB will disappear after test finishes.
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
app.jwt.secret=my-test-secret-key-that-is-at-least-32-characters-long